# cargo-psp EBOOT metadata (read from this crate dir at `cargo psp` time).
# The XMB shows `title` beside ICON0. ICON0 is the Pocket3D app icon, read from
# the PocketJS checkout; this repository holds no icon file. PIC1 is
# OpenStrike's own full-screen backdrop behind the game's listing
# (assets/PIC1.png, built by scripts/gen-cover.ts).
title = "OpenStrike"
xmb_icon_png = "../../vendor/pocketjs/engine/pocket3d/icon/psp/ICON0.PNG"
xmb_background_png = "assets/PIC1.png"
