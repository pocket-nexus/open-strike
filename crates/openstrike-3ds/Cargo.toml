[package]
name = "openstrike-3ds"
version = "0.3.4"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["rlib", "staticlib"]

[features]
embedded-map-catalog = []

[lints.rust]
# The reused PSP vocabulary has a PSP-only profiling feature. It is never
# enabled by this crate, including builds with --all-features.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("bench"))'] }

[dependencies]
openstrike-mods = { path = "../openstrike-mods" }
openstrike-character = { path = "../openstrike-character" }
openstrike-core = { path = "../openstrike-core", default-features = false, features = ["libm"] }
pocket3d-bsp = { path = "../../vendor/pocketjs/engine/pocket3d/crates/pocket3d-bsp", default-features = false, features = ["libm"] }
pocket3d-gles2 = { path = "../../vendor/pocketjs/engine/pocket3d/crates/pocket3d-gles2" }
glam = { version = "0.33", default-features = false, features = ["libm", "scalar-math"] }
libm = "0.2"

[target.'cfg(target_os = "horizon")'.dependencies]
pocketjs-3ds-core = { package = "openstrike-3ds-ui", path = "ui-core" }

[workspace]
resolver = "2"

[profile.release]
panic = "abort"
opt-level = 2
codegen-units = 1
lto = true
