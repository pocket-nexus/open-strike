name: 3DS contracts and input

on:
  pull_request:
    paths:
      [
        "ports/pocket3d/crates/openstrike-3ds/**",
        "ports/pocket3d/crates/openstrike-core/**",
        "ports/pocket3d/crates/openstrike-character/**",
        "ports/pocket3d/crates/openstrike-mods/**",
        "ports/pocket3d/crates/openstrike-vita/src/**",
        "ports/pocket3d/crates/openstrike-psp/src/strike.rs",
        "ports/pocket3d/game/**",
        "ports/pocket3d/scripts/3ds.ts",
        "ports/pocket3d/scripts/deploy-3ds.*",
        "ports/pocket3d/test/*3ds*",
        "ports/pocket3d/test/tactical-touch.test.ts",
        "ports/pocket3d/pocket.json",
        "ports/pocket3d/package.json",
        "ports/pocket3d/domain/**", "ports/pocket3d/vendor/pocketjs",
        ".github/workflows/3ds.yml",
      ]
  push:
    branches: [main]
    paths:
      [
        "ports/pocket3d/crates/openstrike-3ds/**",
        "ports/pocket3d/crates/openstrike-core/**",
        "ports/pocket3d/crates/openstrike-character/**",
        "ports/pocket3d/crates/openstrike-mods/**",
        "ports/pocket3d/crates/openstrike-vita/src/**",
        "ports/pocket3d/crates/openstrike-psp/src/strike.rs",
        "ports/pocket3d/game/**",
        "ports/pocket3d/scripts/3ds.ts",
        "ports/pocket3d/scripts/deploy-3ds.*",
        "ports/pocket3d/test/*3ds*",
        "ports/pocket3d/test/tactical-touch.test.ts",
        "ports/pocket3d/pocket.json",
        "ports/pocket3d/package.json",
        "ports/pocket3d/domain/**", "ports/pocket3d/vendor/pocketjs",
        ".github/workflows/3ds.yml",
      ]
  workflow_dispatch: {}

permissions:
  contents: read

# The Pocket3D builds live in ports/pocket3d (README.md "Ports").
defaults:
  run:
    working-directory: ports/pocket3d

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: git submodule update --init vendor/pocketjs
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ports/pocket3d/crates/openstrike-3ds
      - run: bun run setup
      - run: bun run check:platforms
      - run: bun run test:3ds
      - run: bun run build:3ds --pocket-only
