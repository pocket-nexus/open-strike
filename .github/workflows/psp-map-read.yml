name: PSP map reader

on:
  pull_request:
    paths:
      - "crates/openstrike-psp/src/maps/**"
      - "crates/openstrike-psp/src/maps.rs"
      - "crates/openstrike-psp/src/main.rs"
      - "test/psp-map-read.test.ts"
      - ".github/workflows/psp-map-read.yml"
  push:
    branches: [main]
    paths:
      - "crates/openstrike-psp/src/maps/**"
      - "crates/openstrike-psp/src/maps.rs"
      - "crates/openstrike-psp/src/main.rs"
      - "test/psp-map-read.test.ts"
      - ".github/workflows/psp-map-read.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  read:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - run: bun test test/psp-map-read.test.ts
