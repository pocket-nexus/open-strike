name: PSP map reader

on:
  pull_request:
    paths:
      - "ports/pocket3d/crates/openstrike-psp/src/maps/**"
      - "ports/pocket3d/crates/openstrike-psp/src/maps.rs"
      - "ports/pocket3d/crates/openstrike-psp/src/main.rs"
      - "ports/pocket3d/test/psp-map-read.test.ts"
      - "ports/pocket3d/scripts/psp-memory.ts"
      - "ports/pocket3d/test/psp-memory.test.ts"
      - ".github/workflows/psp-map-read.yml"
  push:
    branches: [main]
    paths:
      - "ports/pocket3d/crates/openstrike-psp/src/maps/**"
      - "ports/pocket3d/crates/openstrike-psp/src/maps.rs"
      - "ports/pocket3d/crates/openstrike-psp/src/main.rs"
      - "ports/pocket3d/test/psp-map-read.test.ts"
      - "ports/pocket3d/scripts/psp-memory.ts"
      - "ports/pocket3d/test/psp-memory.test.ts"
      - ".github/workflows/psp-map-read.yml"
  workflow_dispatch: {}

permissions:
  contents: read

# The Pocket3D builds live in ports/pocket3d (README.md "Ports").
defaults:
  run:
    working-directory: ports/pocket3d

jobs:
  read:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - run: bun test test/psp-map-read.test.ts test/psp-memory.test.ts
